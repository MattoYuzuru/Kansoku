{
  "schema_version": "kansoku.metrics/1",
  "contract_version": "1.0.0",
  "effective_at": "2026-07-21",
  "priority_meaning": {
    "must": "Required for the MVP release gate when the source capability is supported.",
    "should": "In MVP scope but not a release blocker when evidence or a safe dependency is unavailable.",
    "could": "Post-MVP or opt-in experiment."
  },
  "state_contract": {
    "registry": "kansoku.glossary/1#state_registry",
    "value_states": [
      "observed",
      "unsupported",
      "not_observed",
      "redacted",
      "unknown",
      "numeric_zero"
    ],
    "completeness_states": [
      "complete",
      "partial",
      "degraded"
    ],
    "policy": "Observed denotes a source-supplied qualifying non-content value before aggregation. Every metric may be not_observed when its declared source interval is healthy but its eligible population is empty. Redacted and unknown remain explicit even when a metric normally consumes metadata; neither is coerced to numeric_zero."
  },
  "formula_fixture_boundary": {
    "input_stage": "normalized_metric_records",
    "proves": "Registry-bound aggregation semantics over deterministic normalized records, including population filtering, deduplication, selection by a preclassified in_interval boolean, authorized exclusions, ordering, completeness and declared evaluator parameters.",
    "does_not_prove": "Timestamp-to-interval classification or exact [from,to) boundary behavior, raw agent-event parsing, lineage derivation or production SQL; those implementation gates belong to Sessions 03 and 04."
  },
  "quantile_semantics": {
    "method": "percentile_cont",
    "probability": 0.95,
    "ordering": "ascending numeric value; nulls excluded with an explicit exclusion count",
    "interpolation": "linear between zero-based ranks floor((n-1)*p) and ceil((n-1)*p)",
    "empty_population": "unknown",
    "postgresql_equivalent": "percentile_cont(0.95) WITHIN GROUP (ORDER BY value)"
  },
