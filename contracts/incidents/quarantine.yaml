  "manifest_fields": ["quarantine_id", "incident_id", "source_kind", "source_instance", "signal_kind", "event_type", "structural_field_paths", "primitive_types", "shape_value_state", "schema_fingerprint", "adapter_version", "source_schema_version", "parser_version", "classification", "rejection_reason", "first_seen_at", "last_seen_at", "occurrence_count", "total_record_count", "total_byte_count", "disposition"],
  "value_states": ["observed", "unsupported", "not_observed", "redacted", "unknown"],
  "primitive_types": ["string", "integer", "number", "boolean", "null", "array", "object"],
  "field_path_policy": {
    "allowed": "Only reviewed protocol field names or segments accepted by the shared privacy categorizer may persist.",
    "unknown_segments": "Reject, replace with a closed category, or HMAC-pseudonymize each segment before persistence.",
    "values": "No field value, body, excerpt, resource URI, URL, environment value, raw key judged sensitive, or upstream error text is stored."
