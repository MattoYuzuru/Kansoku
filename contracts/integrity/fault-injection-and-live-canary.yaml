{
  "schema_version": "kansoku.integrity-fault-injection-and-live-canary/1",
  "contract_version": "1.0.0",
  "effective_at": "2026-07-23",
  "fault_injection_catalog": [
    {
      "fault_id": "hook_removed_disabled_or_untrusted",
      "tdd_bullet": "remove/disable/untrust hook",
      "target_detection_claim": "stage_2_endpoint_and_hook_verification detects a hook entry missing, disabled or untrusted for a configured adapter without mutating the target config",
      "expected_detection_slo_seconds": 30,
      "expected_incident_failure_class": "hook_removed_disabled_or_untrusted",
      "reused_precedent": "Session 06/07's existing hook trust/enabled-state audit-only rule (contracts/codex/hooks-and-otel.yaml, contracts/claude/hooks-and-otel.yaml) is the exact detection this fault test exercises; this session adds the scheduled/injected test around it, not a new detection mechanism"
    },
    {
      "fault_id": "otlp_wrong_port_protocol_or_auth",
      "tdd_bullet": "wrong OTLP port/protocol/auth",
      "target_detection_claim": "stage_2_endpoint_and_hook_verification's passive OTel endpoint probe detects a configured OTLP endpoint that no longer accepts the expected port/protocol/auth without sending any live agent traffic",
      "expected_detection_slo_seconds": 30,
      "expected_incident_failure_class": "otlp_misconfigured"
    },
    {
