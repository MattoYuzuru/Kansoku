      "expected_detection_slo_seconds": 45,
      "expected_incident_failure_class": "synthetic_pipeline_probe_failed"
    },
    {
      "fault_id": "unknown_schema_quarantine",
      "tdd_bullet": "parser silently ignores a new event type (must instead quarantine, not ignore)",
      "target_detection_claim": "stage_7_unknown_schema_and_lag detects an event_schema_fingerprint absent from the compatibility registry and opens metadata_only_quarantine per contracts/observability/lifecycles.yaml's terminal_failure state, never silently drops it",
      "expected_detection_slo_seconds": 30,
      "expected_incident_failure_class": "unknown_schema"
    },
    {
