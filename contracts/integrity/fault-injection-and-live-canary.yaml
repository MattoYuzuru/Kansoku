      "expected_detection_slo_seconds": 90,
      "expected_incident_failure_class": "watermark_stall",
      "reused_precedent": "contracts/observability/reconciliation.yaml's silence classification (eligible_activity/true_inactivity/eligibility_unknown) is reused verbatim; this session adds the scheduled check and fixture, not a new classification"
    },
    {
