      "tdd_bullet": "database/rollup/retention job falls behind (ingest-lag case)",
      "target_detection_claim": "stage_7_unknown_schema_and_lag flags ingest lag exceeding its configured budget using the same freshness.late_events_pending signal RepairQueueDepth exposes",
      "expected_detection_slo_seconds": 60,
      "expected_incident_failure_class": "ingest_lag"
    },
    {
      "fault_id": "inventory_cache_miscount",
      "tdd_bullet": "inventory scanner counts cache versions as enabled components",
      "target_detection_claim": "stage_1_discovery_and_configuration's plugin/skill/MCP inventory snapshot check reuses adaptersdk.NODE_KINDS cache-separation rule (a cache_artifact node never counts as enabled without an explicit enabled_for edge) and fails if a cached component is miscounted as active",
      "expected_detection_slo_seconds": 30,
      "expected_incident_failure_class": "permission_denied",
      "note": "this fault maps to the closest existing failure_class (a discovery/config-scoped defect) rather than inventing a new one; a future contract revision may add a dedicated inventory_miscount class if evidence shows it recurs distinctly"
    }
  ],
  "catalog_completeness_rule": "every bullet under TDD 08's 'Fault-injection tests' heading and every failure mode under the Engineering Proposal's 'Failure modes to detect' heading has exactly one fault_injection_catalog entry naming its target_detection_claim, expected_detection_slo_seconds and expected_incident_failure_class; evidence_classification_rule determines whether this session has classifier coverage, deterministic mutation integration, or an explicitly pending runtime requirement, and validators must reject any ID missing from or duplicated across those classes",
  "evidence_classification_rule": {
    "component_classifier": [
      "hook_removed_disabled_or_untrusted",
      "otlp_wrong_port_protocol_or_auth",
      "transcript_truncate_rotate_schema_or_permission_change",
      "active_process_with_absent_events",
      "duplicate_and_stalled_watermarks",
      "parser_panic_timeout_or_unknown_field",
      "delayed_rollup",
      "full_disk",
      "stale_backup",
      "privacy_canary_violation",
      "live_canary_partial_dag",
      "live_canary_provider_timeout",
      "endpoint_unreachable",
      "unknown_schema_quarantine",
      "cross_source_reconciliation_regression",
      "ingest_lag",
      "inventory_cache_miscount"
    ],
    "deterministic_mutation_integration": [
      "corrupt_spool",
      "synthetic_pipeline_probe_failure"
    ],
    "runtime_required": [
      "db_restart",
      "failed_restore"
    ]
  },
  "measured_detection_time_rule": "only deterministic mutation or real runtime tests may claim a measured detection SLO: they record wall-clock fault activation, execute the production check through the scheduler, and compare the later persisted Incident.OpenedAt with expected_detection_slo_seconds; component_classifier tests prove classification only and MUST NOT assert an end-to-end SLO, while runtime_required entries remain unclaimed until the named transition actually executes",
  "live_canary_recipe_schema": {
    "fields": {
      "recipe_id": "string, unique per adapter, e.g. codex-canary-v1",
      "adapter_id": "string, must match an internal/adaptersdk.Registry.IDs() entry",
      "command": "array of non-empty strings, the exact non-interactive argv used against the fixture workspace; never a shell string and never evaluated by a shell",
      "fixture_workspace": "string path, a uniquely named, disposable directory created fresh per run and destroyed on cleanup; never a user's real repository",
      "canary_skill_name": "string, a uniquely namespaced skill/plugin identifier (e.g. kansoku-canary-<adapter_id>) that cannot collide with any real user-installed skill name",
      "local_mcp_echo_tool": "string, the name of a local, harmless, bounded MCP echo tool the canary invokes; it performs no network egress and no filesystem write outside fixture_workspace",
      "expected_event_dag": [
        "session.started", "prompt.submitted", "component.invoked(canary)",
        "tool.called(mcp.echo)", "tool.succeeded", "component.succeeded", "session.stopped"
      ],
      "adapter_specific_alternative_note": "capabilities without a native node in expected_event_dag substitute an adapter-specific expected alternative declared in that adapter's own contracts/<adapter>/*.yaml, never a silent skip",
      "max_turns": "integer, hard upper bound on agent turns for one canary run",
      "max_tokens": "integer, hard upper bound on tokens consumed",
      "max_cost_usd": "number, hard upper bound on estimated cost",
      "max_duration_seconds": "integer, matches stage_10_optional_live_canary's timeout_seconds in audit-run-and-schedule.yaml",
      "cooldown_seconds": "integer, minimum time between two live canary runs for the same recipe_id, independent of the daily schedule",
      "cleanup": "string, describes deterministic teardown of fixture_workspace and any spawned process after every run, success or failure",
      "namespace_exclusion": "string, states the canary's session/event identifiers carry an explicit test namespace tag and are excluded from personal usage metrics and real activity counts by default, matching the synthetic-pipeline-probe namespace rule in audit-run-and-schedule.yaml"
    },
    "disabled_by_default_gate": {
      "rule": "every live_canary_recipe entry has enabled=false until BOTH explicit_credentials_present=true (the target agent's normal auth path already has valid credentials, never copied or stored by Kansoku) AND explicit_user_consent_recorded=true (a durable, timestamped consent record distinct from general installer consent) are true",
      "no_silent_enable": "no code path flips enabled to true automatically; version_change_detected and startup triggers never enable a previously-disabled recipe",
      "scope_precedent": "this matches the Session 06/07 precedent that Codex/Claude adapters ship with fixture-based canaries (Adapter.Audit(mode=fixture_replay)), not live-CLI execution, as an explicit documented downstream gap -- this session builds the recipe/budget/cooldown/cleanup machinery structurally and exercises it in simulation/fixture form only; it does not spawn a real external agent process against a real account in this environment"
    }
  },
  "expected_event_dag_precision_rule": "canary success requires the exact node set and edges of expected_event_dag, not merely a matching count; a missing node, an extra node, or a node observed out of the declared order each produce a distinct, precisely identified check failure (missing_node, extra_node, misordered_node) rather than one generic 'canary failed' result"
}
