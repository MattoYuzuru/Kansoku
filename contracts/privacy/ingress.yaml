{
  "schema_version": "kansoku.privacy-ingress/1",
  "contract_version": "1.0.0",
  "effective_at": "2026-07-21",
  "controls": [
    {"id": "PRV-INGRESS-001", "requirement": "Only generated/typed SafeRecord and SafeError values may cross the sanitizer boundary; generic maps remain internal."},
    {"id": "PRV-INGRESS-002", "requirement": "Decoder enforces byte, depth, array, string and frame limits before any logging, tracing, retry or quarantine serialization."},
    {"id": "PRV-INGRESS-003", "requirement": "Unknown source schemas and fields produce metadata-only quarantine errors and never silent drop or coercion."}
  ],
  "limits": {"max_total_bytes": 1048576, "max_depth": 16, "max_array_items": 1024, "max_object_fields": 1024, "max_string_bytes": 65536, "max_number_bytes": 128, "max_records": 128, "max_protobuf_frame_bytes": 1048576, "compressed_input": "reject_until_streaming_bomb_limits_are_implemented"},
  "decoder_policy": {"top_level": "single_object_or_nonempty_object_array", "duplicate_names": "reject_after_json_unescape_before_map_materialization", "unicode": "valid_utf8_and_paired_utf16_escapes_only", "numbers": "finite_ieee754_range_only", "trailing_data": "reject", "error_selection": "lexicographically_sorted_field_traversal_after_structural_decode"},
  "source_schemas": [
    {
      "id": "fixture.agent-hook/1",
      "adapter_id": "fixture-agent",
      "adapter_version": "1.0.0",
      "event_types": ["session_started", "user_prompt", "tool_finished", "session_finished"],
      "models": ["catalog/model-safe"],
      "tools": ["inventory/tool-safe"],
      "components": ["inventory/skill-safe"],
      "input_fields": ["event_id", "session_id", "observed_at", "event_type", "outcome", "value_state", "model", "tool_name", "prompt", "attachments", "response", "source_code", "tool_input", "tool_output", "command", "path", "environment", "credentials", "exception"]
    }
  ],
  "durable_record_fields": ["record_id", "idempotency_key", "adapter_id", "adapter_version", "source_schema_id", "schema_fingerprint", "observed_at", "received_at", "confidence", "event_type", "outcome", "value_state", "model", "tool", "component_mentions", "prompt_features", "redaction_counts", "lineage"],
  "safe_error_fields": ["incident_id", "source_schema_id", "schema_fingerprint", "field_path", "category", "total_bytes", "record_count", "observed_at", "received_at"],
  "nested_types": {
    "CatalogObservation": {"fields": {"state": "observation_state", "id": "nullable_catalog_id"}, "closed": true},
    "PromptFeatures": {"fields": {"state": "completeness_state", "byte_count": "nonnegative_integer", "character_count": "nonnegative_integer", "word_count": "nonnegative_integer", "line_count": "nonnegative_integer", "coarse_script": "coarse_script_enum", "code_fence_count": "nonnegative_integer", "attachment_count": "nonnegative_integer", "url_reference_count": "nonnegative_integer", "file_reference_count": "nonnegative_integer"}, "closed": true},
    "RedactionCounts": {"fields": {"prompt_fields": "nonnegative_integer", "attachment_fields": "nonnegative_integer", "response_fields": "nonnegative_integer", "source_fields": "nonnegative_integer", "tool_io_fields": "nonnegative_integer", "command_fields": "nonnegative_integer", "path_fields": "nonnegative_integer", "environment_fields": "nonnegative_integer", "credential_fields": "nonnegative_integer", "exception_fields": "nonnegative_integer", "sensitive_identifier_fields": "nonnegative_integer"}, "closed": true},
    "Lineage": {"fields": {"source_record_pseudonym": "hmac_sha256", "session_pseudonym": "hmac_sha256", "adapter_id": "registered_adapter_id", "adapter_version": "registered_adapter_version", "source_schema_id": "registered_schema_id", "schema_fingerprint": "sha256", "sanitizer_version": "registered_sanitizer_version", "contract_sha256": "sha256_hex"}, "closed": true},
    "SafeLogEvent": {"fields": {"event_name": "safe_event_enum", "category": "safe_error_category", "adapter_id": "registered_or_empty_adapter_id", "source_schema_id": "registered_or_unknown_schema_id", "schema_fingerprint": "sha256_or_hmac_sha256", "field_path": "safe_structural_path", "byte_count": "nonnegative_integer", "record_count": "bounded_nonnegative_integer", "outcome": "outcome_enum_or_empty", "value_state": "value_state_or_empty", "duration_ms": "nonnegative_integer"}, "closed": true}
  },
  "enums": {"value_states": ["unsupported", "not_observed", "redacted", "unknown", "numeric_zero"], "observation_states": ["observed", "unsupported", "not_observed", "redacted", "unknown"], "completeness_states": ["complete", "partial", "degraded", "unknown"], "coarse_scripts": ["unknown", "latin", "cyrillic", "cjk", "other", "mixed"], "outcomes": ["succeeded", "failed", "cancelled", "interrupted", "timed_out", "abandoned", "unknown"]},
  "fingerprint_policy": {"known_schema": "sha256 over the complete canonical registered schema, nested type, enum, catalog and sanitizer contract", "unknown_schema": "device-keyed HMAC over source ID/version/catalog structure and decoded field/type shape; never expose untrusted identifiers", "drift": "any authoritative field/type/enum/catalog/version change changes the known fingerprint"},
  "word_rule": "Count maximal contiguous Unicode letter-or-number runs; combining marks continue a run only after a letter/number. No token text is retained.",
  "stable_prompt_hashes": false,
  "embeddings": false,
  "optional_prompt_hmac": false,
  "privacy_safe_log_fields": ["event_name", "category", "adapter_id", "source_schema_id", "schema_fingerprint", "field_path", "byte_count", "record_count", "outcome", "value_state", "duration_ms"],
  "forbidden_log_operations": ["payload_object", "raw_error", "formatted_struct", "source_value", "tool_value", "environment_value"]
}
