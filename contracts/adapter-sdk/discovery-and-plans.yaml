  "change_plan_fields": ["plan_id", "installation_candidate_id", "capability_id", "precondition_hash", "before_sanitized_diff", "after_sanitized_diff", "backup_locator", "commands", "privacy_disclosure", "rollback_command"],
  "change_plan_reuse": "change_plan_apply_rollback_and_removal_reuse_internal_installer_plan_approval_simulateapply_simulaterollback_simulateremove_and_plansha256_verbatim_scoping_them_by_capability_id_instead_of_inventing_a_second_apply_rollback_mechanism",
  "apply_requires": ["explicit_confirmation", "precondition_recheck_against_current_config_hash_to_avoid_overwriting_a_concurrent_edit"],
  "normal_operation_rule": "normal_collector_operation_never_applies_a_change_plan_apply_only_happens_through_an_explicit_operator_initiated_configure_or_verify_flow",
