  ],
  "host_view_fields": ["allowed_roots", "read_probe", "read_config_probe", "exec_probe", "pseudonymize_path"],
  "host_view_guarantee": "host_view_exposes_only_permission_checked_read_and_exec_probes_scoped_to_allowed_roots_no_adapter_ever_receives_a_database_credential_connection_string_or_unscoped_filesystem_handle_read_config_probe_is_size_bounded_to_1_mib_with_an_explicit_truncated_flag_and_reuses_read_probes_allowed_root_and_symlink_safety_checks",
