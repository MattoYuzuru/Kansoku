{
  "schema_version": "kansoku.data-platform-schema/1",
  "contract_version": "1.2.0",
  "effective_at": "2026-07-26",
  "engine": {"product": "PostgreSQL", "major_version": 18, "image_digest": "sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15", "volume_path": "/var/lib/postgresql"},
  "migration_policy": {
    "tool": "kansoku_embedded_sql_migrator",
    "naming": "NNNN_description.sql",
    "direction": "up_and_down_pairs",
    "ledger_table": "schema_migrations",
    "ledger_fields": ["version", "checksum_sha256", "applied_at"],
    "rule": "migrations are append-only after their first trusted commit; a checksum mismatch against the ledger fails startup"
  },
  "tables": {
    "dimensions": ["devices", "agent_installations", "agent_surfaces", "agent_versions", "projects", "models", "providers", "price_catalog_versions", "components", "component_versions", "component_installations", "component_relations", "adapter_versions", "source_instances", "source_schema_fingerprints", "agent_installation_profiles", "source_installation_attributions"],
    "activity_facts": ["sessions", "turns", "prompt_features", "events", "event_evidence", "model_operations", "token_usage", "cost_estimates", "component_lifecycle_events", "component_assertions", "component_observation_windows", "tool_calls", "mcp_connections", "change_outcomes", "correlations", "session_installation_attributions"],
    "inventory": ["inventory_snapshots", "inventory_nodes", "inventory_edges", "component_inventory_state", "component_file_tree_metadata", "inventory_collection_status"],
    "component_contracts": ["component_terminal_contracts"],
    "quality_operations": ["source_watermarks", "completeness_intervals", "ingest_failures", "schema_quarantine_metadata", "reconciliation_runs", "reconciliation_mismatches", "audit_runs", "audit_checks", "incidents", "retention_policies", "backup_runs", "restore_tests", "formula_versions", "rollup_status"],
    "rollups": ["metric_rollups_hourly", "metric_rollups_daily", "rollup_repair_queue"]
  },
  "partitioning": {
    "strategy": "range_partition_monthly_by_observed_at",
    "partitioned_tables": ["events", "event_evidence", "model_operations", "token_usage", "tool_calls", "mcp_connections"],
    "partition_naming": "<table>_p<yyyy><mm>",
    "creation": "ensure_current_and_next_partition_before_insert_window_closes",
    "drop_policy": "retention_worker_drops_whole_partitions_only_never_row_by_row_delete_for_partitioned_fact_tables"
  },
  "indexing": {
    "idempotency": {"index": "unique", "scope": "source_instance_id, source_native_event_id", "table": "events"},
    "time": {"index": "brin", "column": "observed_at", "tables": ["events", "event_evidence", "model_operations", "token_usage"]},
    "lookup": {"index": "btree", "columns": ["session_id", "component_id", "source_instance_id", "component_installation_id"], "tables": ["events", "tool_calls", "component_lifecycle_events", "component_assertions", "component_observation_windows"]}
  },
  "constraints": {
    "state_enums": "checked via CHECK constraints referencing a fixed allowed-value list per column",
    "nonnegative_counts": "CHECK (count >= 0) on every count/duration/byte column",
    "confidence_range": "CHECK (confidence >= 0 AND confidence <= 1)",
    "source_lineage": "NOT NULL foreign key to source_instances and adapter_versions on every fact row",
    "eav_policy": "no generic entity-attribute-value table is used for primary analytics; sanitized adapter extension fields use a bounded JSONB column with adapter/schema version and byte-size CHECK constraint"
  },
  "jsonb_extension_fields": {
    "columns": ["events.source_extension", "tool_calls.source_extension"],
    "bound_by": ["source_schema_id", "schema_fingerprint"],
    "max_bytes": 4096,
    "forbidden_keys": ["prompt", "response", "body", "content", "source_code", "tool_input", "tool_output", "command", "path", "environment", "credential", "exception", "attributes", "payload", "error_message"]
  }
}
