<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Per-request server injection (internal/webui). The Go index handler
      renders this file as a template and fills these two meta tags with the
      real read-bearer / CSRF token values. The frontend API client reads them
      once at startup. Never logged, never placed in a URL. Go template
      delimiters pass through Vite untouched.
    -->
    <meta name="kansoku-read-token" content="{{.ReadToken}}" />
    <meta name="kansoku-csrf-token" content="{{.CSRFToken}}" />

    <title>Kansoku</title>

    <!-- Favicons / manifest (§8), all self-hosted under /public. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#8B7FD6" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E0E11" />

    <!--
      Pre-paint appearance application (§9): read kansoku.appearance.v1 and set
      data-theme + the two accent custom properties BEFORE first paint so there
      is no flash of the default theme. Mirrors theme.tsx's applyAppearance.
    -->
    <script nonce="{{.CSPNonce}}">
      (function () {
        try {
          var raw = localStorage.getItem("kansoku.appearance.v1");
          var a = raw ? JSON.parse(raw) : null;
          var theme = a && a.theme === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          var purple = theme === "light" ? "#6F63C4" : "#8B7FD6";
          var gold = theme === "light" ? "#8A6D1F" : "#D9B45B";
          if (a && a.version === 1) {
            purple = (theme === "light" ? a.accentPurpleLight : a.accentPurple) || purple;
            gold = (theme === "light" ? a.accentGoldLight : a.accentGold) || gold;
          }
          function rgb(hex) {
            var match = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
            if (!match) return null;
            var value = parseInt(match[1], 16);
            return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
          }
          function mix(base, accent, weight) {
            var left = rgb(base);
            var right = rgb(accent);
            if (!left || !right) return base;
            return ("#" + left.map(function (channel, index) {
              return Math.round(channel * (1 - weight) + right[index] * weight)
                .toString(16).padStart(2, "0");
            }).join("")).toUpperCase();
          }
          var surface = theme === "light" ? "#FFFFFF" : "#16161B";
          if (!rgb(purple)) purple = theme === "light" ? "#6F63C4" : "#8B7FD6";
          document.documentElement.style.setProperty("--accent-purple", purple);
          document.documentElement.style.setProperty("--accent-gold", gold);
          document.documentElement.style.setProperty("--row-hover", mix(surface, purple, 0.1));
          document.documentElement.style.setProperty("--row-selected", mix(surface, purple, 0.18));
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <link rel="modulepreload" crossorigin href="/assets/query-I7fzXg3t.js">
    <link rel="stylesheet" crossorigin href="/assets/index-9Wp7qkon.css">
  </head>

</html>
